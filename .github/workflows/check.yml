name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Do not install git hooks in CI.
  LEFTHOOK: 0
  # src/shared/browser.env.ts validates this at import time; the unit tests load it and CI has
  # no .env. Any http(s) URL will do: nothing is requested during `bun run check`.
  VITE_NELCOTA_URL: http://127.0.0.1:8000

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run check
