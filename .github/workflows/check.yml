name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Do not install git hooks in CI.
  LEFTHOOK: 0
  # src/shared/browser.env.ts validates this at import time; the unit tests load it and CI has
  # no .env. Any http(s) URL will do: nothing is requested during `bun run check`.
  VITE_NELCOTA_URL: http://127.0.0.1:8000

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run check

      # tsc and Knip do not exercise the Vite/TanStack Start bundling; the build does.
      - run: bun run build

      - run: bun audit --audit-level=high

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same version as the local environment (see README). The checksum is the one published
      # next to the binary in the release.
      NELCOTA_VERSION: v0.5.5
      NELCOTA_SHA256: 038711290887c2e9967643b78395d779bd616e43fbf2fc7f6aa737370301966e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Install the Nelcota CLI
        run: |
          curl --fail --silent --show-error --location \
            --output nelcota \
            "https://github.com/Nelcota/Nelcota/releases/download/${NELCOTA_VERSION}/nelcota-x86_64-unknown-linux-musl"
          echo "${NELCOTA_SHA256}  nelcota" | sha256sum --check -
          chmod +x nelcota
          sudo mv nelcota /usr/local/bin/nelcota

      - name: Start Postgres and the Nelcota server
        run: |
          nelcota dev > nelcota-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if grep -q "nelcota is up" nelcota-dev.log; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              echo "the Nelcota dev environment did not start in time"
              cat nelcota-dev.log
              exit 1
            fi
            sleep 2
          done
          # The dev environment generates its own Postgres password; keep it out of the logs.
          password=$(grep '^POSTGRES_PASSWORD=' .nelcota/dev.env | cut -d= -f2-)
          port=$(grep '^DB_PORT=' .nelcota/dev.env | cut -d= -f2-)
          echo "::add-mask::${password}"
          echo "DATABASE_URL=postgres://postgres:${password}@127.0.0.1:${port}/postgres" >> "$GITHUB_ENV"

      - run: nelcota migrate

      - run: bun run test:db

      - name: Check that src/shared/database.ts matches the migrated schema
        run: |
          nelcota types -o src/shared/database.ts
          git diff --exit-code -- src/shared/database.ts

      - name: Show the Nelcota server log
        if: failure()
        run: cat nelcota-dev.log
